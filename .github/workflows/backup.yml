name: Nightly database backup

# 19:30 UTC = 01:00 Asia/Kolkata — after the day's bookings, before the morning.
#
# ⚠️ GitHub disables scheduled workflows after ~60 days of repository inactivity,
# and it does so SILENTLY as far as this job is concerned: the workflow simply
# stops firing. That is why HEALTHCHECK_URL is not optional in practice — the
# dead-man's switch alerts you when the backup does not arrive, which is the only
# mechanism that catches "the scheduler itself stopped".
#
# See docs/Security_check.md §1.

on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch: # manual runs, and the restore rehearsal

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # The Ubuntu runner ships postgresql-client-16 preinstalled, and pg_dump
      # refuses to dump a server newer than itself. Bump PG_MAJOR when Supabase
      # upgrades Postgres — it is the only place the version is named.
      #
      # Installing the package is NOT enough. /usr/bin/pg_dump is pg_wrapper from
      # postgresql-client-common, which dispatches to a versioned binary under
      # /usr/lib/postgresql/<v>/bin. Adding 17 alongside 16 leaves the wrapper
      # still choosing 16, so the versioned bin directory has to go on PATH.
      # This is exactly how the first run failed: the step printed
      # "pg_dump (PostgreSQL) 16.14" and was still marked ✓.
      - name: Install postgresql-client
        env:
          PG_MAJOR: "17"
        run: |
          set -Eeuo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_MAJOR}"

          # Put the versioned binaries ahead of the wrapper for every later step.
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/${PG_MAJOR}/bin:$PATH"

          # Assert, do not print. A version nobody reads is not a check — that is
          # precisely how 16.14 got through a step marked ✓.
          pg_dump --version
          pg_dump --version | grep -q "PostgreSQL) ${PG_MAJOR}" || {
            echo "::error::pg_dump is not ${PG_MAJOR} — got: $(pg_dump --version)"
            exit 1
          }
          psql --version | grep -q "PostgreSQL) ${PG_MAJOR}" || {
            echo "::error::psql is not ${PG_MAJOR} — got: $(psql --version)"
            exit 1
          }

      - name: Run backup
        env:
          # Direct connection (port 5432), NOT the pooler — pg_dump needs a
          # session connection and the transaction pooler will refuse it.
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          chmod +x scripts/backup.sh
          scripts/backup.sh
